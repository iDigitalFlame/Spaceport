PACKAGER="iDigitalFlame <idf@idigitalflame.com>"

PKGDEST="/var/cache/makepkg"
DBGSRCDIR="/var/cache/debug"
PURGE_TARGETS=(usr/{,share}/info/dir .packlist *.pod)
INTEGRITY_CHECK=(sha256 sha512)

CARCH="x86_64"
CHOST="x86_64-pc-linux-gnu"

PKGEXT=".pkg.tar.zst"
SRCEXT=".src.tar.gz"

DOC_DIRS=(usr/{,local/}{,share/}{doc,gtk-doc} opt/*/{doc,gtk-doc})
LIB_DIRS=("lib:usr/lib" "lib32:usr/lib32")
MAN_DIRS=({usr{,/local}{,/share},opt/*}/{man,info})

VCSCLIENTS=('bzr::breezy' 'git::git' 'fossil::fossil' 'hg::mercurial' 'svn::subversion')

DLAGENTS=('scp::/usr/bin/scp -C %u %o'
          'file::/usr/bin/curl -gqC - -o %o %u'
          'rsync::/usr/bin/rsync --no-motd -z %u %o'
          'http::/usr/bin/curl -gqb "" -fLC - --retry 3 --retry-delay 3 -o %o %u'
          'https::/usr/bin/curl -gqb "" -fLC - --retry 3 --retry-delay 3 -o %o %u')

OPTIONS=(strip docs !libtool !staticlibs !emptydirs zipman purge !debug lto)

BUILDDIR="/tmp/makepkg"
BUILDENV=(!distcc color !ccache check !sign)

CFLAGS="-march=native -mtune=generic -O2 -pipe -fno-plt -fexceptions \
        -Wp,-D_FORTIFY_SOURCE=3 -Wformat -Werror=format-security \
        -fstack-protector-strong -fstack-clash-protection -fcf-protection \
        -fno-omit-frame-pointer -mno-omit-leaf-frame-pointer"
LDFLAGS="-Wl,-O1,--sort-common,--as-needed,-z,relro,-z,now,-z,pack-relative-relocs"
CPPFLAGS="-D_FORTIFY_SOURCE=2"
CXXFLAGS="${CFLAGS} -Wp,-D_GLIBCXX_ASSERTIONS"
LTOFLAGS="-flto=auto"
MAKEFLAGS="-j4"
RUSTFLAGS="-C opt-level=3 -C target-cpu=native -Cforce-frame-pointers=yes"

COMPRESSZ=(compress -c -f)
COMPRESSGZ=(gzip -c -f -n)
COMPRESSLZ=(lzip -c -f)
COMPRESSXZ=(xz -c -z --threads=0 -)
COMPRESSBZ2=(bzip2 -c -f)
COMPRESSLRZ=(lrzip -q)
COMPRESSLZ4=(lz4 -q)
COMPRESSLZO=(lzop -q)
COMPRESSZST=(zstd -c -z -q --ultra --threads=0 -20 -)

STRIP_SHARED="--strip-unneeded"
STRIP_STATIC="--strip-debug"
STRIP_BINARIES="--strip-all"

DEBUG_CFLAGS="-g -fvar-tracking-assignments"
DEBUG_CXXFLAGS="-g -fvar-tracking-assignments"
DEBUG_RUSTFLAGS="-C debuginfo=0"
