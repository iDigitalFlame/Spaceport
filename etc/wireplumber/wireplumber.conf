wireplumber.components.rules = [
    {
        matches = [
            {
                type     = "script/lua"
            }
        ]
        actions = {
            merge = {
                requires = [ support.lua-scripting ]
            }
        }
    },
    {
        matches = [
            {
                name     = "!~monitors/.*"
                provides = "~hooks.*"
            }
        ]
        actions = {
            merge = {
                before   = [ support.standard-event-source ]
            }
        }
    },
    {
        matches = [
            {
                provides = "~monitor.*"
            }
        ]
        actions = {
            merge = {
                after    = [ support.standard-event-source ]
            }
        }
    },
    {
        matches = [
            {
                name     = "!session-services.lua"
            }
        ]
        actions = {
            merge = {
                before   = [ support.session-services ]
            }
        }
    }
]

