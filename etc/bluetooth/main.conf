[General]
Name                        = spaceport
Privacy                     = limited-device
Testing                     = false
DebugKeys                   = false
Experimental                = true
MultiProfile                = multiple
NameResolving               = true
AlwaysPairable              = false
ControllerMode              = dual
MaxControllers              = 0
FastConnectable             = true
PairableTimeout             = 60
RefreshDiscovery            = true
TemporaryTimeout            = 30
SecureConnections           = on
JustWorksRepairing          = never
KernelExperimental          = true
DiscoverableTimeout         = 60
ReverseServiceDiscovery     = false
RemoteNameRequestRetryDelay = 300

[LE]
CentralAddressResolution    = 1
AdvMonNoFilterScanDuration  = 500
EnableAdvMonInterleaveScan  = 1
AdvMonAllowlistScanDuration = 300

[GATT]
Cache                       = always
Channels                    = 5
ExchangeMTU                 = 517
ExportClaimedServices       = read-only

[CSIS]
Rank                        = 0
Size                        = 0
Client                      = true
Encryption                  = true

[AVRCP]
VolumeCategory              = true
VolumeWithoutTarget         = false

[AVDTP]
StreamMode                  = streaming
SessionMode                 = ertm

[Policy]
AutoEnable                  = true
ResumeDelay                 = 5
ReconnectAttempts           = 5
ReconnectIntervals          = 1,2,4,8,16,32,64

[AdvMon]
RSSISamplingPeriod          = 0xFF
