[Service]
ExecStart     =
ExecStart     = bootctl --quiet --graceful --esp-path=/boot/esp random-seed
ExecStartPre  = mount -o rw,remount /boot/esp
ExecStartPre  = mount -o rw,remount /sys/firmware/efi/efivars
ExecStartPost = mount -o ro,remount /boot/esp
ExecStartPost = mount -o ro,remount /sys/firmware/efi/efivars
