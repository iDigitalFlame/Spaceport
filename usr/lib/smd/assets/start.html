            function clock() {
                let d = document.getElementById("time");
                if (d !== null) {
                    let v = new Date(new Date().toLocaleString("en-US", {timeZone: "America/New_York"}));
                    let s = (v.getSeconds() % 2 == 0) ? ":" : " "
                    d.innerHTML = v.getHours().toString().padStart(2, "0") + "<span>" + s +"</span>" + v.getMinutes().toString().padStart(2, "0");
                    setInterval(clock, 1000);
                }
            }
            window.onload = function() {
                let e = document.getElementById("quote");
                if (e !== null) {
                    e.innerText = quotes[Math.floor(Math.random() * quotes.length)];
                }
                clock();
            };
        </script>

    <body>
        <div id="center">
            <div id="time"></div>
            <div id="quote"></div>
        </div>
    </body>
