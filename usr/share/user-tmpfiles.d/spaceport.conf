d  "%t/trash"                 0700 - - - -
d  "%t/mounts"                0700 - - - -

d  "%t/temp/aur"              0700 - - - -
d  "%t/temp/aur/src"          0700 - - - -
d  "%t/temp/aur/build"        0700 - - - -

d- "%h/.local/lib/python/bin" 0750 - - - -

L+ "%C/tmp"                   -    - - - %t/temp
L+ "%S/Trash"                 -    - - - %t/trash
L+ "%h/Volumes"               -    - - - %t/mounts
